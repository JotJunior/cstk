# shellcheck.yml — lint estatico (advisory) dos scripts shell do toolkit,
# MAIS o gate estrutural (nao-advisory) dos manifestos de plugin/marketplace.
#
# Proposito do lint: capturar quebras de POSIX/sh cedo, em PR e push para
# main, SEM bloquear merge ou release. O step de shellcheck roda com
# `continue-on-error: true` — os achados aparecem no log e no Step Summary,
# mas o job nunca falha por causa dele (gate de lint fica por conta de
# `tests/run.sh` no release.yml).
#
# Excecao deliberada (claude-plugin-packaging, FASE 5.4): o step "Validate
# plugin manifests" NAO tem continue-on-error — MP-1..MP-4/MP-6
# (contracts/plugin-artifacts.md) sao bugs reais de manifesto e devem
# bloquear PR mesmo fora de release; so MP-5 (lockstep de versao com a tag)
# e aviso aqui, porque nao ha tag corrente para comparar fora do release
# (o gate estrito de MP-5 vive em release.yml).
#
# Mesma excecao (panel-monorepo, FASE 5.2/5.3): o step "Validate panel
# workspace lockstep" tambem NAO tem continue-on-error — WL-1..WL-4
# (os 4 package.json + package-lock.json do painel fora de lockstep entre
# si) sao bugs reais e devem bloquear PR mesmo fora de release; so WL-5
# (lockstep de versao com a tag) e aviso aqui pelo mesmo motivo de MP-5
# (o gate estrito de WL-5 vive em release.yml).
#
# Config de severidade/ruido vem do .shellcheckrc na raiz (compartilhado com o
# dev local). shellcheck ja vem instalado na imagem ubuntu-latest.
#
# Ref: melhoria de tooling (shellcheck CI + fast/slow + stats).

name: shellcheck

on:
  pull_request:
    paths:
      - '**/*.sh'
      - '.shellcheckrc'
      - '.github/workflows/shellcheck.yml'
      - '.claude-plugin/**'
      - 'plugins/*/.claude-plugin/**'
      - 'plugins/cstk/hooks/hooks.json'
      - 'panel/package.json'
      - 'panel/package-lock.json'
      - 'panel/apps/*/package.json'
      - 'panel/packages/*/package.json'
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - '.shellcheckrc'
      - '.github/workflows/shellcheck.yml'
      - '.claude-plugin/**'
      - 'plugins/*/.claude-plugin/**'
      - 'plugins/cstk/hooks/hooks.json'
      - 'panel/package.json'
      - 'panel/package-lock.json'
      - 'panel/apps/*/package.json'
      - 'panel/packages/*/package.json'

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint shell scripts (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate plugin manifests (structural gate; version lockstep advisory)
        # Ref: docs/specs/claude-plugin-packaging/contracts/plugin-artifacts.md
        # Sem --version/--strict: MP-1..MP-4/MP-6 continuam bloqueantes (sao
        # bugs reais de manifesto, nao licenca de versionamento) — SO MP-5
        # (lockstep com a tag) vira aviso aqui, porque fora do release nao
        # ha tag corrente para comparar. O gate estrito de MP-5 vive em
        # release.yml (--version "$BARE" --strict).
        run: ./scripts/validate-plugin-manifests.sh

      - name: Validate panel workspace lockstep (structural gate; version lockstep advisory)
        # Ref: docs/specs/panel-monorepo/spec.md FR-015/FR-016
        # Sem --version/--strict: WL-1..WL-4 continuam bloqueantes (drift
        # real entre os 4 package.json + package-lock.json do painel) — SO
        # WL-5 (lockstep com a tag) vira aviso aqui, porque fora do release
        # nao ha tag corrente para comparar. O gate estrito de WL-5 vive em
        # release.yml (--version "$BARE" --strict).
        run: ./scripts/validate-panel-workspace-lockstep.sh

      - name: Run shellcheck (non-gating)
        continue-on-error: true
        run: |
          set -u
          shellcheck --version
          # Coleta todos os .sh do repo, exceto .git e fixtures (bytes crus /
          # scripts intencionalmente invalidos para os testes).
          files=$(find . -type f -name '*.sh' \
            -not -path './.git/*' \
            -not -path './tests/fixtures/*' \
            -not -path './tests/cstk/fixtures/*')
          count=$(printf '%s\n' "$files" | grep -c .)
          echo "Analisando $count script(s) .sh..."
          # -f gcc: uma linha por achado (file:line:col: severity: msg [SCxxxx]).
          # Nunca propaga exit !=0 (advisory); continue-on-error e o cinto extra.
          printf '%s\n' "$files" | xargs shellcheck -f gcc | tee shellcheck.out || true
          findings=$(grep -c . shellcheck.out || true)
          {
            echo "# shellcheck (advisory)"
            echo ""
            echo "- scripts analisados: **$count**"
            echo "- achados: **${findings:-0}**"
            echo ""
            if [ "${findings:-0}" -gt 0 ]; then
              echo '```'
              cat shellcheck.out
              echo '```'
            else
              echo "Sem achados. ✅"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
