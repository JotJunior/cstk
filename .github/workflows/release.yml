# release.yml — pipeline automatizado de release do cstk.
#
# Ref: docs/specs/cstk-cli/tasks.md FASE 9.2
#      docs/specs/cstk-cli/spec.md FR-010 (GitHub Releases como canal)
#      docs/specs/cstk-cli/research.md Decision 5 (versionamento unificado)
#
# Disparo: push de tag SemVer (`v*`).
#
# Etapas:
#   1. Checkout do tag
#   2. Validacao do formato da tag (vX.Y.Z[-suffix])
#   3. Validacao dos manifestos de plugin/marketplace (MP-1..MP-6,
#      `scripts/validate-plugin-manifests.sh --strict`) — ver
#      docs/specs/claude-plugin-packaging/contracts/plugin-artifacts.md
#   3b. Validacao do lockstep de versao dos workspaces npm do painel
#      (WL-1..WL-5, `scripts/validate-panel-workspace-lockstep.sh --strict`)
#      — ver docs/specs/panel-monorepo/spec.md FR-015/FR-016
#   4. Suite de testes do toolkit (`tests/run.sh` + `tests/cstk/test_*.sh`)
#      como pre-requisito — release falha se qualquer teste falhar
#   5. Build deterministico do tarball via `scripts/build-release.sh <tag>`
#   6. Empacotamento do painel via `git archive HEAD:panel` (FR-010, FR-011;
#      docs/specs/panel-monorepo/contracts/serve-asset-selection.md §4) —
#      `panel/.gitattributes` (export-ignore) garante `.claude/`/`.github/`
#      fora do pacote; `panel/package.json`+`package-lock.json` ficam na raiz
#      da arvore extraida por herdarem de `HEAD:panel`
#   7. Criacao do GitHub Release com upload de:
#        - cstk-<bare-version>.tar.gz
#        - cstk-<bare-version>.tar.gz.sha256
#        - cli/install.sh                    (asset standalone, one-liner FR-005a)
#        - cstk-panel-<bare-version>.tar.gz          (mesma release, FR-011)
#        - cstk-panel-<bare-version>.tar.gz.sha256
#
# Ambiente: ubuntu-latest. GNU tar do runner garante determinismo via
# --sort=name + --mtime=@0 (caminho preferencial em scripts/build-release.sh).
# O empacotamento do painel (`git archive`) e determinístico por natureza do
# proprio comando (mesma arvore git => mesmos bytes), sem necessidade de
# normalizacao adicional de mtime/uid/gid.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necessario para `gh release create`

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags + commits para gerar release notes

      - name: Validate tag format
        id: tag
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          # Aceita v0.1.0, v1.2.3-rc.1, v0.0.0-test, etc.
          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "::error::tag invalida: $TAG (esperado vX.Y.Z[-suffix])"
              exit 1
              ;;
          esac
          BARE="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bare=$BARE" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG (bare: $BARE)"

      - name: Validate plugin manifests (MP-1..MP-6, lockstep gate)
        # Ref: docs/specs/claude-plugin-packaging/contracts/plugin-artifacts.md
        # --strict torna MP-5 (lockstep de versao com a tag) bloqueante
        # SOMENTE aqui, no release. Fora de release (shellcheck.yml) o
        # mesmo script roda sem --version/--strict — MP-5 vira aviso, os
        # demais invariantes (MP-1..4/6) continuam sempre bloqueantes.
        run: ./scripts/validate-plugin-manifests.sh --version "${{ steps.tag.outputs.bare }}" --strict

      - name: Validate panel workspace lockstep (WL-1..WL-5)
        # Ref: docs/specs/panel-monorepo/tasks.md FASE 5.1/5.2/5.3
        #      docs/specs/panel-monorepo/spec.md FR-015 (a numeracao de
        #      versao do painel passa a avancar junto com a tag do
        #      repositorio unificado, substituindo a serie independente que
        #      tinha antes da migracao), FR-016 (lockstep entre os 3
        #      workspaces npm do painel)
        # --strict torna WL-5 (lockstep de versao com a tag) bloqueante
        # SOMENTE aqui, no release — mesmo padrao do gate MP-5 acima.
        run: ./scripts/validate-panel-workspace-lockstep.sh --version "${{ steps.tag.outputs.bare }}" --strict

      - name: Run test suite (main + cstk integrados)
        # FASE 9.3 integrou tests/cstk/ no runner principal; tests/run.sh
        # agora cobre toda a suite (~242 cenarios incluindo cli/lib/).
        run: ./tests/run.sh

      - name: Build release tarball
        run: ./scripts/build-release.sh "${{ steps.tag.outputs.tag }}"

      - name: Package panel distribution
        # Ref: docs/specs/panel-monorepo/tasks.md FASE 4.1
        #      contracts/serve-asset-selection.md §4 (EXPECTED = "cstk-panel-" + bare + ".tar.gz")
        # `git archive ... HEAD:panel` usa panel/ como raiz do arquivo, entao
        # panel/.gitattributes (export-ignore de .claude/ e .github/) se aplica
        # e package.json + package-lock.json ficam na raiz da arvore extraida
        # (FR-010) sem passo adicional de copia/rename.
        run: |
          set -eu
          BARE="${{ steps.tag.outputs.bare }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="cstk-panel-${BARE}/" \
            -o "dist/cstk-panel-${BARE}.tar.gz" HEAD:panel
          sha256sum "dist/cstk-panel-${BARE}.tar.gz" > "dist/cstk-panel-${BARE}.tar.gz.sha256"

      - name: Verify build artifacts
        run: |
          set -eu
          BARE="${{ steps.tag.outputs.bare }}"
          test -f "dist/cstk-${BARE}.tar.gz" || { echo "::error::tarball ausente"; exit 1; }
          test -f "dist/cstk-${BARE}.tar.gz.sha256" || { echo "::error::sha256 ausente"; exit 1; }
          test -f "cli/install.sh" || { echo "::error::cli/install.sh ausente"; exit 1; }
          test -f "dist/cstk-panel-${BARE}.tar.gz" || { echo "::error::tarball do painel ausente"; exit 1; }
          test -f "dist/cstk-panel-${BARE}.tar.gz.sha256" || { echo "::error::sha256 do painel ausente"; exit 1; }
          echo "Artifacts:"
          ls -la \
            "dist/cstk-${BARE}.tar.gz" "dist/cstk-${BARE}.tar.gz.sha256" cli/install.sh \
            "dist/cstk-panel-${BARE}.tar.gz" "dist/cstk-panel-${BARE}.tar.gz.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"
          BARE="${{ steps.tag.outputs.bare }}"
          # Sufixo SemVer de pre-release (v6.0.0-alpha.1, v1.2.3-rc.1) publica
          # como prerelease — fora de releases/latest, canal estavel intacto.
          PRERELEASE=""
          case "$BARE" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$TAG" $PRERELEASE \
            --title "cstk $TAG" \
            --generate-notes \
            "dist/cstk-${BARE}.tar.gz" \
            "dist/cstk-${BARE}.tar.gz.sha256" \
            "cli/install.sh" \
            "dist/cstk-panel-${BARE}.tar.gz" \
            "dist/cstk-panel-${BARE}.tar.gz.sha256"

      - name: Summary
        run: |
          BARE="${{ steps.tag.outputs.bare }}"
          {
            echo "# cstk ${{ steps.tag.outputs.tag }} released"
            echo ""
            echo "## Artifacts"
            echo "- \`cstk-${BARE}.tar.gz\` ($(stat -c %s dist/cstk-${BARE}.tar.gz) bytes)"
            echo "- \`cstk-${BARE}.tar.gz.sha256\`"
            echo "- \`install.sh\` (bootstrap one-liner)"
            echo "- \`cstk-panel-${BARE}.tar.gz\` ($(stat -c %s dist/cstk-panel-${BARE}.tar.gz) bytes)"
            echo "- \`cstk-panel-${BARE}.tar.gz.sha256\`"
            echo ""
            echo "## SHA-256"
            echo '```'
            cat "dist/cstk-${BARE}.tar.gz.sha256"
            cat "dist/cstk-panel-${BARE}.tar.gz.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
