# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "bugfix-005"
description: "trigger eval: a query deve disparar a skill bugfix"
tags: ["trigger", "bugfix", "gen"]
execution:
  prompt: "quando o usuario completa o cadastro, o email de boas-vindas nao esta chegando — ja vi que a fila RabbitMQ parece estar recebendo a mensagem, mas o consumer nao processa"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-bugfix"
    tool: "Skill"
    input_match: "bugfix"
    min: 1
