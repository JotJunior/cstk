# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "bugfix-006"
description: "trigger eval: a query deve disparar a skill bugfix"
tags: ["trigger", "bugfix", "gen"]
execution:
  prompt: "o endpoint de login tá retornando 500 quando mando a senha com caracteres especiais tipo & e <, parece que tem algo escapando errado lá no handler de autenticação"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-bugfix"
    tool: "Skill"
    input_match: "bugfix"
    min: 1
