# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "bugfix-008"
description: "trigger eval: a query deve disparar a skill bugfix"
tags: ["trigger", "bugfix", "gen"]
execution:
  prompt: "nosso fluxo de pagamento as vezes falha silenciosamente — a transacao some do banco mas a confirmacao nunca chega pro usuario. ja olhei os logs e o erro nao aparece em lugar nenhum obvio. preciso entender de onde isso pode estar vindo"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-bugfix"
    tool: "Skill"
    input_match: "bugfix"
    min: 1
