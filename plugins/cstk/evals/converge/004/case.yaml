schema_version: "1.0"
name: "converge-004"
description: "trigger eval: a query deve disparar a skill converge"
tags: ["trigger", "converge", "hard"]
execution:
  prompt: "roda uma auditoria de divergencia spec-vs-codigo nessa feature e me diz o que ainda falta implementar de verdade"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-converge"
    tool: "Skill"
    input_match: "converge"
    min: 1
