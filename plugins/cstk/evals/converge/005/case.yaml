# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "converge-005"
description: "trigger eval: a query deve disparar a skill converge"
tags: ["trigger", "converge", "gen"]
execution:
  prompt: "o time marcou as tarefas como concluidas, mas sera que o codigo que esta no repositorio hoje realmente cobre o que a gente descreveu na spec? quero um raio-x comparando codigo com o que foi pedido"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-converge"
    tool: "Skill"
    input_match: "converge"
    min: 1
