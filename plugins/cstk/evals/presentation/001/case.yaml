# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "presentation-001"
description: "trigger eval: a query deve disparar a skill presentation"
tags: ["trigger", "presentation", "base"]
execution:
  prompt: "cria uma apresentacao do projeto a partir das docs, briefing, constituicao e specs"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-presentation"
    tool: "Skill"
    input_match: "presentation"
    min: 1
