# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "analyze-008"
description: "trigger eval: a query deve disparar a skill analyze"
tags: ["trigger", "analyze", "gen"]
execution:
  prompt: "consegue olhar se as tarefas que criei estao alinhadas com a spec e com o plano? quero saber se tem gap ou contradicao entre eles"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-analyze"
    tool: "Skill"
    input_match: "analyze"
    min: 1
