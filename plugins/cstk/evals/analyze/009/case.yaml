# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "analyze-009"
description: "trigger eval: a query deve disparar a skill analyze"
tags: ["trigger", "analyze", "hard"]
execution:
  prompt: "confere se o plano tecnico bate com o que a spec promete, sem abrir nenhum arquivo de codigo — so os documentos da feature"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-analyze"
    tool: "Skill"
    input_match: "analyze"
    min: 1
