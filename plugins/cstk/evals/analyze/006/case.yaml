schema_version: "1.0"
name: "analyze-006"
description: "trigger eval: a query deve disparar a skill analyze"
tags: ["trigger", "analyze", "gen"]
execution:
  prompt: "a constituicao do projeto diz uma coisa e as tarefas que criamos dizem outra — quero entender onde os dois divergem"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-analyze"
    tool: "Skill"
    input_match: "analyze"
    min: 1
