# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "analyze-010"
description: "trigger eval: a query deve disparar a skill analyze"
tags: ["trigger", "analyze", "gen"]
execution:
  prompt: "quero saber se as tarefas do backlog cobrem tudo que a spec pede — comparando so spec, plano e tasks entre si, nao o codigo implementado"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-analyze"
    tool: "Skill"
    input_match: "analyze"
    min: 1
