# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "e2e-integration-flow-001"
description: "trigger eval: a query deve disparar a skill e2e-integration-flow"
tags: ["trigger", "e2e-integration-flow", "base"]
execution:
  prompt: "escreve um teste e2e com playwright validando o fluxo de checkout em todas as camadas"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-e2e-integration-flow"
    tool: "Skill"
    input_match: "e2e-integration-flow"
    min: 1
