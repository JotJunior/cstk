schema_version: "1.0"
name: "constitution-002"
description: "trigger eval: a query deve disparar a skill constitution"
tags: ["trigger", "constitution", "gen"]
execution:
  prompt: "quero documentar que nesse projeto TDD e inegociavel, sem cobertura de teste nao mergeia, e que qualidade vem antes de velocidade — como registro isso de forma oficial?"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-constitution"
    tool: "Skill"
    input_match: "constitution"
    min: 1
