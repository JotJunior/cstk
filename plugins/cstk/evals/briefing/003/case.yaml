# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "briefing-003"
description: "trigger eval: a query deve disparar a skill briefing"
tags: ["trigger", "briefing", "gen"]
execution:
  prompt: "to come cando um projeto novo do zero pra um cliente. ainda nao escrevi nada, nao sei nem qual stack usar, quero fazer as perguntas certas primeiro pra entender o negocio dele"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-briefing"
    tool: "Skill"
    input_match: "briefing"
    min: 1
