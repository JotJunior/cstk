schema_version: "1.0"
name: "review-features-001"
description: "trigger eval: a query deve disparar a skill review-features"
tags: ["trigger", "review-features", "base"]
execution:
  prompt: "me da um dashboard comparando o progresso de todas as features do portfolio"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-review-features"
    tool: "Skill"
    input_match: "review-features"
    min: 1
