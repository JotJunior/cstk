schema_version: "1.0"
name: "execute-task-001"
description: "trigger eval: a query deve disparar a skill execute-task"
tags: ["trigger", "execute-task", "base"]
execution:
  prompt: "implementa a tarefa T-014 seguindo o workflow de execucao"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
