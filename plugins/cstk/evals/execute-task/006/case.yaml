# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "execute-task-006"
description: "trigger eval: a query deve disparar a skill execute-task"
tags: ["trigger", "execute-task", "gen"]
execution:
  prompt: "executar a task de integracao com o servico de notificacoes: precisa disparar o push quando o pedido mudar de status, salvar o log no postgres e marcar como enviado na tabela"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-execute-task"
    tool: "Skill"
    input_match: "execute-task"
    min: 1
