# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "clarify-005"
description: "trigger eval: a query deve disparar a skill clarify"
tags: ["trigger", "clarify", "gen"]
execution:
  prompt: "nossa spec de pagamentos ficou pronta mas o time ta com duvida se o fluxo de reembolso cobre o caso de estorno parcial — da pra passar por ela e fechar esses pontos abertos antes de planejar?"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-clarify"
    tool: "Skill"
    input_match: "clarify"
    min: 1
