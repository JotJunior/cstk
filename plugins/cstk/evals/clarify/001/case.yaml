# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "clarify-001"
description: "trigger eval: a query deve disparar a skill clarify"
tags: ["trigger", "clarify", "base"]
execution:
  prompt: "a spec dessa feature tem ambiguidades, me ajuda a resolver com perguntas estruturadas"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-clarify"
    tool: "Skill"
    input_match: "clarify"
    min: 1
