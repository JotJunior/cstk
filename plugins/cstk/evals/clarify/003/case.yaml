schema_version: "1.0"
name: "clarify-003"
description: "trigger eval: a query deve disparar a skill clarify"
tags: ["trigger", "clarify", "hard"]
execution:
  prompt: "a spec dessa feature ja existe, mas o time nao concorda no que significa 'pedido concluido'; alinha isso comigo"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
