# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "clarify-004"
description: "trigger eval: a query deve disparar a skill clarify"
tags: ["trigger", "clarify", "gen"]
execution:
  prompt: "o documento de spec que temos ja tem os requisitos funcionais, mas ficou vago na parte de autenticacao — precisamos resolver essas ambiguidades antes de partir pra implementacao"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-clarify"
    tool: "Skill"
    input_match: "clarify"
    min: 1
