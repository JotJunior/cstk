schema_version: "1.0"
name: "clarify-002"
description: "trigger eval: a query deve disparar a skill clarify"
tags: ["trigger", "clarify", "base"]
execution:
  prompt: "a feature ja esta especificada mas faltou detalhar o formato de saida; refina a spec existente"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-clarify"
    tool: "Skill"
    input_match: "clarify"
    min: 1
