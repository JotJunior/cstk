# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "cstk-init-006"
description: "trigger eval: a query deve disparar a skill cstk-init"
tags: ["trigger", "cstk-init", "hard"]
execution:
  prompt: "o repositorio ja esta rodando em producao e agora o time quer comecar a usar o fluxo spec-driven nele; monta o briefing e a constitution olhando o README, os testes e os manifestos, e so me pergunta o que nao der pra saber"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-cstk-init"
    tool: "Skill"
    input_match: "cstk-init"
    min: 1
