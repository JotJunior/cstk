# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "owasp-security-001"
description: "trigger eval: a query deve disparar a skill owasp-security"
tags: ["trigger", "owasp-security", "base"]
execution:
  prompt: "faz um security review desse endpoint de login seguindo OWASP"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-owasp-security"
    tool: "Skill"
    input_match: "owasp-security"
    min: 1
