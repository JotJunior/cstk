# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "review-task-004"
description: "trigger eval: a query deve disparar a skill review-task"
tags: ["trigger", "review-task", "gen"]
execution:
  prompt: "me fala quais tarefas ja posso comecar a implementar agora, quais ainda tem prerequisito em aberto e quantas foram concluidas ate agora"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-review-task"
    tool: "Skill"
    input_match: "review-task"
    min: 1
