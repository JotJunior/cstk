schema_version: "1.0"
name: "validate-documentation-001"
description: "trigger eval: a query deve disparar a skill validate-documentation"
tags: ["trigger", "validate-documentation", "base"]
execution:
  prompt: "audita a qualidade e completude do UC-CAD-001.md contra o padrao estrutural"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-validate-documentation"
    tool: "Skill"
    input_match: "validate-documentation"
    min: 1
