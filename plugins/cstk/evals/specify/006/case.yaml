# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "specify-006"
description: "trigger eval: a query deve disparar a skill specify"
tags: ["trigger", "specify", "gen"]
execution:
  prompt: "vou adicionar uma feature de multi-tenant no sistema — ainda nao tem spec nenhuma, mas sei os atores, os fluxos e as restricoes principais. como transformo isso num artefato utilizavel pelo time?"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-specify"
    tool: "Skill"
    input_match: "specify"
    min: 1
