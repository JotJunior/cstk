# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "specify-001"
description: "trigger eval: a query deve disparar a skill specify"
tags: ["trigger", "specify", "base"]
execution:
  prompt: "quero comecar uma feature nova de exportacao de relatorios em CSV, cria a spec"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-specify"
    tool: "Skill"
    input_match: "specify"
    min: 1
