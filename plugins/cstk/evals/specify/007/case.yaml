# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "specify-007"
description: "trigger eval: a query deve disparar a skill specify"
tags: ["trigger", "specify", "gen"]
execution:
  prompt: "tenho uma ideia de feature: quando o usuario finalizar o checkout, ele recebe um email de confirmacao com PDF do pedido anexado. como eu converto isso numa spec formal com criterios de aceite?"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-specify"
    tool: "Skill"
    input_match: "specify"
    min: 1
