schema_version: "1.0"
name: "reconcile-docs-006"
description: "trigger eval: a query deve disparar a skill reconcile-docs"
tags: ["trigger", "reconcile-docs", "hard"]
execution:
  prompt: "o comportamento mudou no codigo depois de uns bugfixes e ninguem mexeu na spec; traz a documentacao de volta pra realidade sem mexer em nenhum arquivo de codigo"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-reconcile-docs"
    tool: "Skill"
    input_match: "reconcile-docs"
    min: 1
