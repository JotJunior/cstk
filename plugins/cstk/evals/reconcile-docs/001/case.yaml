# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "reconcile-docs-001"
description: "trigger eval: a query deve disparar a skill reconcile-docs"
tags: ["trigger", "reconcile-docs", "base"]
execution:
  prompt: "a spec da feature de billing ja esta registrada em docs/specs mas o codigo recebeu varios bugfixes e ela ficou desatualizada; atualiza a documentacao pra bater com o codigo"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-reconcile-docs"
    tool: "Skill"
    input_match: "reconcile-docs"
    min: 1
