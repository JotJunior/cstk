schema_version: "1.0"
name: "apply-insights-001"
description: "trigger eval: a query deve disparar a skill apply-insights"
tags: ["trigger", "apply-insights", "gen"]
execution:
  prompt: "Acabei de rodar /insights e ele mostrou vários padrões de uso. Como eu aplico isso no projeto pra melhorar o fluxo?"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-apply-insights"
    tool: "Skill"
    input_match: "apply-insights"
    min: 1
