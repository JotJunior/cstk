schema_version: "1.0"
name: "model-selector-006"
description: "trigger eval: a query deve disparar a skill model-selector"
tags: ["trigger", "model-selector", "gen"]
execution:
  prompt: "tenho aqui a descricao de uma tarefa e queria uma segunda opiniao deterministica sobre o tamanho dela antes de decidir quanto poder computacional jogar nisso"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
