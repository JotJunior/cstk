# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "plan-005"
description: "trigger eval: a query deve disparar a skill plan"
tags: ["trigger", "plan", "gen"]
execution:
  prompt: "preciso estruturar como o serviço de notificações vai conversar com o de pedidos. tem race condition hoje que a gente resolve com retry, mas quero definir os contratos e o modelo de dados antes de continuar remendando"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-plan"
    tool: "Skill"
    input_match: "plan"
    min: 1
