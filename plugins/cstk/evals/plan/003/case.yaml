# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "plan-003"
description: "trigger eval: a query deve disparar a skill plan"
tags: ["trigger", "plan", "gen"]
execution:
  prompt: "ja tenho a spec da feature de pagamentos pronta, agora quero entender como isso vai ser estruturado tecnicamente — arquitetura, tabelas do banco, contratos de API"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-plan"
    tool: "Skill"
    input_match: "plan"
    min: 1
