# GERADO por tests/trigger-eval/gen-eval-cases.sh — nao edite a mao.
# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "plan-004"
description: "trigger eval: a query deve disparar a skill plan"
tags: ["trigger", "plan", "gen"]
execution:
  prompt: "me ajuda a pensar no design da solucao para a feature de exportacao de relatorios — quero entender as opcoes de armazenamento, como a API vai funcionar e o que precisa ser testado"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-plan"
    tool: "Skill"
    input_match: "plan"
    min: 1
