# Fonte: plugins/cstk/skills/*/evals/triggers.jsonl + tests/trigger-eval/negatives.jsonl
schema_version: "1.0"
name: "validate-docs-rendered-001"
description: "trigger eval: a query deve disparar a skill validate-docs-rendered"
tags: ["trigger", "validate-docs-rendered", "base"]
execution:
  prompt: "confere se os diagramas mermaid desse doc renderizam e se os links internos resolvem"
  max_turns: 3
  timeout_seconds: 120
runs: 1
graders:
  - type: tool_used
    name: "fires-validate-docs-rendered"
    tool: "Skill"
    input_match: "validate-docs-rendered"
    min: 1
